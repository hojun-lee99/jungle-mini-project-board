<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>회원가입</title>
    <!-- <link href="../static/css/output.css" rel="stylesheet" /> -->
  </head>

<body>

  <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">회원가입</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form action="/api/auth/register" method="POST" class="space-y-6">
        <div>
            <label for="id" class="block text-sm/6 font-medium text-gray-900">아이디</label>
            <div class="mt-2">
            <input 
                id="id" 
                type="id" 
                name="id" 
                required autocomplete="id" 
                class="block w-full rounded-md bg-white border border-1 border-black px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
            </div>
        </div>

        <div>
            <div class="flex items-center justify-between">
            <label for="username" class="block text-sm/6 font-medium text-gray-900">이름</label>
            </div>
            <div class="mt-2">
            <input 
                id="username" 
                type="text" 
                name="username" 
                required autocomplete="current-name" 
                class="block w-full rounded-md bg-white border border-1 border-black px-3 py-1.5 text-base text-gray-900 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
            </div>
        </div>


        <div>
            <div class="flex items-center justify-between">
            <label for="password" class="block text-sm/6 font-medium text-gray-900">비밀번호</label>
            </div>
            <div class="mt-2">
            <input 
                id="password" 
                type="password" 
                name="password" 
                required autocomplete="current-password" 
                class="block w-full rounded-md bg-white border border-1 border-black px-3 py-1.5 text-base text-gray-900 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
            </div>
        </div>

        <div>
            <div class="flex items-center justify-between">
            <label for="password_confirm" class="block text-sm/6 font-medium text-gray-900">비밀번호 확인</label>
            </div>
            <div class="mt-2">
            <input 
                id="password_confirm" 
                type="password" 
                name="password_confirm" 
                required autocomplete="password" 
                class="block w-full rounded-md bg-white border border-1 border-black px-3 py-1.5 text-base text-gray-900 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
            </div>
        </div>
        
        <div id="error_message" class="mt-4 p-3 rounded-md bg-red-50 border border-red-200">
            <p class="text-sm text-red-600 font-medium text-center"> 내용 </p>
        </div>

        <div>
            <button type="submit" class="flex w-full justify-center rounded-md bg-[#05d182] px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-[#05d182] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#05d182]">가입하기</button>
        </div>
      </form>

    </div>
</div>

  <script src="../static/js/register.js"></script>
</body>
</html>
