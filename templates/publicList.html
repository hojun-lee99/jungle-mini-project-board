<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <title>공개된 보드 기록</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Pretendard -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<style>
    body {
        font-family: 'Pretendard', sans-serif;
    }

    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
    }
</style>

<body class="bg-slate-50 text-slate-900">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-64 shrink-0 border-r border-slate-200 bg-white transition-all duration-200 ease-in-out">
            <div class="flex h-full flex-col p-3">
                <button id="toggleBtn" aria-expanded="true"
                    class="mb-4 flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100">
                    <span class="material-symbols-outlined" id="toggleIcon">arrow_back_ios</span>
                </button>

                <nav class="flex flex-col gap-2">
                    <a href="/main" id="main-boards-btn"
                        class="nav-item flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="txt whitespace-nowrap" id="mainBoardsText">내가 만든 보드</span>
                    </a>

                    <button id="snapshot-btn"
                        class="nav-item flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        <span class="material-symbols-outlined">archive</span>
                        <span class="txt whitespace-nowrap" id="myArchiveText">내 보드 기록</span>
                    </button>

                    <button id="publicList-btn"
                        class="nav-item is-active flex h-12 items-center justify-center gap-2 rounded-xl bg-emerald-500 px-3 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-600">
                        <span class="material-symbols-outlined">public</span>
                        <span class="txt whitespace-nowrap" id="publicArchiveText">공개된 보드 기록</span>
                    </button>
                </nav>

                <div class="sidebar-bottom mt-auto pt-4">
                    <button
                        class="logout flex h-12 items-center justify-center gap-2 rounded-xl bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50 hover:text-red-500">
                        <span class="material-symbols-outlined">
                            logout
                        </span>
                        <span id="logoutText" class="whitespace-nowrap">로그아웃</span>
                    </button>
                </div>

                <!-- <div class="mt-auto space-y-2 pt-4">
                    <button id="home-btn"
                        class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                        <span class="material-symbols-outlined">home</span>
                        <span class="whitespace-nowrap" id="homeText">홈</span>
                    </button>

                    <button
                        class="logout flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-700 transition hover:bg-slate-50 hover:text-red-500">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="whitespace-nowrap" id="logoutText">로그아웃</span>
                    </button>
                </div> -->
            </div>
        </aside>

        <!-- Content -->
        <main class="flex min-w-0 flex-1 flex-col p-6 md:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">공개된 보드 기록</h1>
            </div>

            <div class="flex-1 overflow-y-auto">
                <ul id="card-list" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
                    {% for s in snapshots|default([]) %}
                    <li class="board-card group overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
                        data-snapshot-id="{{ s.id }}">
                        <div class="board-thumb board-thumb-clickable relative aspect-[4/3] cursor-pointer overflow-hidden bg-slate-200"
                            data-image-url="{{ s.image_url }}">
                            <img src="{{ s.image_url }}" alt="{{ s.label }}"
                                class="h-full w-full object-cover transition duration-300 group-hover:scale-105">

                            <div
                                class="absolute inset-0 flex items-center justify-center bg-black/0 transition group-hover:bg-black/20">
                                <span
                                    class="material-symbols-outlined rounded-full bg-white/90 p-2 text-slate-700 opacity-0 shadow transition group-hover:opacity-100">
                                    zoom_in
                                </span>
                            </div>
                        </div>

                        <div class="p-4">
                            <div class="truncate text-base font-semibold text-slate-800">{{ s.label }}</div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>

                {% if not snapshots %}
                <div id="public-empty"
                    class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center shadow-sm">
                    <div
                        class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-slate-100 text-slate-500">
                        <span class="material-symbols-outlined">public</span>
                    </div>
                    <p class="text-base font-semibold text-slate-700">공개된 보드 기록이 없습니다</p>
                    <p class="mt-1 text-sm text-slate-500">아직 공개된 스냅샷이 없어요.</p>
                </div>
                {% endif %}
            </div>
        </main>
    </div>

    <!-- Image Lightbox -->
    <div id="image-lightbox" aria-hidden="true"
        class="pointer-events-none fixed inset-0 z-50 opacity-0 transition duration-200">
        <div class="image-lightbox-backdrop absolute inset-0 bg-black/70"></div>

        <div
            class="image-lightbox-content absolute left-1/2 top-1/2 w-[calc(100vw-2rem)] max-w-5xl -translate-x-1/2 -translate-y-1/2">
            <button type="button"
                class="image-lightbox-close absolute -top-12 right-0 flex h-10 w-10 items-center justify-center rounded-full bg-white text-slate-800 shadow hover:bg-slate-100"
                aria-label="닫기">
                <span class="text-2xl leading-none">&times;</span>
            </button>

            <div class="overflow-hidden rounded-2xl bg-white shadow-2xl">
                <img class="image-lightbox-img max-h-[80vh] w-full object-contain bg-slate-100" src="" alt="확대 보기" />
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById("sidebar");
        const btn = document.getElementById("toggleBtn");
        const toggleIcon = document.getElementById("toggleIcon");
        const mainBoardsText = document.getElementById("mainBoardsText");
        const myArchiveText = document.getElementById("myArchiveText");
        const publicArchiveText = document.getElementById("publicArchiveText");
        const logoutText = document.getElementById("logoutText");
        const homeText = document.getElementById("homeText");

        btn.addEventListener("click", () => {
            sidebar.classList.toggle("w-64");
            sidebar.classList.toggle("w-20");

            const isCollapsed = sidebar.classList.contains("w-20");

            btn.setAttribute("aria-expanded", String(!isCollapsed));
            toggleIcon.textContent = isCollapsed ? "arrow_forward_ios" : "arrow_back_ios";

            mainBoardsText.textContent = isCollapsed ? "" : "내가 만든 보드";
            myArchiveText.textContent = isCollapsed ? "" : "내 보드 기록";
            publicArchiveText.textContent = isCollapsed ? "" : "공개된 보드 기록";
            logoutText.textContent = isCollapsed ? "" : "로그아웃";
            homeText.textContent = isCollapsed ? "" : "홈";
        });

        // 로그아웃
        document.querySelector(".logout").addEventListener("click", () => {
            fetch("/api/auth/logout", { method: "POST", credentials: "include" })
                .then(() => { window.location.href = "/"; })
                .catch(() => alert("로그아웃에 실패했습니다."));
        });

        // 내 보드 기록 버튼
        $("#snapshot-btn").click(function () {
            window.location.href = "/snapshot";
        });

        // 공개된 보드 기록 버튼
        $("#publicList-btn").click(function () {
            window.location.href = "/publicList";
        });

        // 홈 버튼
        $("#home-btn").click(function () {
            window.location.href = "/main";
        });

        // 이미지 클릭 시 확대 보기
        $(document).on("click", ".board-thumb-clickable", function () {
            const url = $(this).data("image-url");
            if (!url) return;

            $("#image-lightbox .image-lightbox-img").attr("src", url);
            $("#image-lightbox")
                .removeClass("pointer-events-none opacity-0")
                .addClass("pointer-events-auto opacity-100")
                .attr("aria-hidden", "false");
        });

        function closeImageLightbox() {
            $("#image-lightbox")
                .addClass("pointer-events-none opacity-0")
                .removeClass("pointer-events-auto opacity-100")
                .attr("aria-hidden", "true");

            $("#image-lightbox .image-lightbox-img").attr("src", "");
        }

        $("#image-lightbox .image-lightbox-backdrop, #image-lightbox .image-lightbox-close").on("click", closeImageLightbox);

        $(document).on("keydown", function (e) {
            if (e.key === "Escape" && $("#image-lightbox").attr("aria-hidden") === "false") {
                closeImageLightbox();
            }
        });
    </script>
</body>

</html>
