<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>크래프톤 정글 - 보드</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .bg-logo {
        background-image: url('{{ url_for("static", filename="icons/Jungle_by KRAFTON_Logo_G.png") }}');
        background-repeat: no-repeat;
        background-position: center;
        background-size: 300px;
        opacity: 0.5;
      }
      .note {
        position: absolute;
        min-width: 120px;
        min-height: 100px;
        max-width: 200px;
        padding: 8px;
        background: #fef08a;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        border-radius: 4px;
        word-wrap: break-word;
        overflow: hidden;
        cursor: move;
      }
      .wingbar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 200;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s;
      }
      .wingbar-backdrop.is-open {
        opacity: 1;
        visibility: visible;
      }
      .wingbar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 280px;
        max-width: 90vw;
        background: white;
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
        z-index: 201;
        transform: translateX(100%);
        transition: transform 0.25s ease-out;
      }
      .wingbar.is-open {
        transform: translateX(0);
      }
      .wingbar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid #e5e7eb;
      }
      .wingbar-title {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
      }
      .wingbar-close {
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        font-size: 24px;
        line-height: 1;
        color: #6b7280;
        cursor: pointer;
        border-radius: 6px;
        transition: background 0.2s, color 0.2s;
      }
      .wingbar-close:hover {
        background: #f3f4f6;
        color: #111827;
      }
      .wingbar-body {
        padding: 16px;
      }
      .wingbar-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        color: #374151;
        font-size: 15px;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.2s, color 0.2s;
      }
      .wingbar-item:hover {
        background: #f3f4f6;
        color: #111827;
      }
      .wingbar-item-icon {
        font-size: 18px;
        opacity: 0.8;
      }
      .wingbar-section {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #e5e7eb;
      }
      .wingbar-section-title {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .wingbar-note-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 200px;
        overflow-y: auto;
      }
      .wingbar-note-item {
        padding: 10px 12px;
        margin-bottom: 4px;
        font-size: 13px;
        color: #374151;
        background: #f9fafb;
        border-radius: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wingbar-note-item:last-child {
        margin-bottom: 0;
      }
      .wingbar-empty {
        margin: 0;
        font-size: 13px;
        color: #9ca3af;
      }
      /* 이미지 모달 */
      .image-modal {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s;
      }
      .image-modal.is-open {
        opacity: 1;
        visibility: visible;
      }
      .image-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.4);
      }
      .image-modal-panel {
        position: relative;
        width: 90%;
        max-width: 400px;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      }
      .image-modal-title {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 600;
        color: #111827;
      }
      .image-modal-input {
        display: block;
        width: 100%;
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      .image-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .image-modal-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .image-modal-btn-secondary {
        background: #f3f4f6;
        color: #374151;
      }
      .image-modal-btn-primary {
        background: #05D182;
        color: white;
      }
      #btn-add-image.image-mode-active {
        outline: 2px solid #05D182;
        outline-offset: 2px;
      }
    </style>
    <link
      href="{{ url_for('static', filename='css/output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white w-full h-screen overflow-auto relative">
    <header
      class="flex justify-between items-center p-6 md:px-10 md:py-8 fixed top-0 w-full z-50"
    >
      <h1
        class="text-3xl md:text-4xl font-bold text-gray-500 tracking-wide cursor-pointer hover:text-gray-700 transition"
        id="board-title"
      >
        보드 제목
      </h1>

      <div class="flex items-center space-x-4 md:space-x-6">
        <button id="btn-share" class="hover:scale-110 transition transform">
          <img
            src="{{ url_for('static', filename='icons/share.svg') }}"
            alt="공유"
            class="w-9 h-9"
          />
        </button>

        <button id="btn-add-image" class="hover:scale-110 transition transform" title="이미지 추가 모드 (클릭 후 보드에서 위치 선택)">
          <img
            src="{{ url_for('static', filename='icons/image.svg') }}"
            alt="이미지 추가"
            class="w-9 h-9"
          />
        </button>

        <button id="btn-menu" class="hover:scale-110 transition transform">
          <img
            src="{{ url_for('static', filename='icons/menu.svg') }}"
            alt="메뉴"
            class="w-10 h-10"
          />
        </button>
      </div>
    </header>

    <main
      id="board-container"
      class="min-w-full min-h-[calc(100vh-6rem)] bg-logo relative z-10 pt-24"
      data-public-id="{{ public_id }}"
    ></main>

    <!-- 우측 윙바 -->
    <div class="wingbar-backdrop" id="wingbar-backdrop" aria-hidden="true"></div>
    <aside class="wingbar" id="wingbar" aria-hidden="true">
      <div class="wingbar-header">
        <span class="wingbar-title">메뉴</span>
        <button type="button" id="btn-close-wingbar" class="wingbar-close" aria-label="닫기">×</button>
      </div>
      <div class="wingbar-body">
        <a href="/main" class="wingbar-item">
          <span class="wingbar-item-icon">≡</span>
          <span>내 보드 목록</span>
        </a>
        <div class="wingbar-section">
          <h3 class="wingbar-section-title">내가 쓴 메모</h3>
          <ul class="wingbar-note-list" id="wingbar-my-notes"></ul>
          <p class="wingbar-empty" id="wingbar-my-notes-empty" style="display:none;">쓴 메모가 없습니다.</p>
        </div>
      </div>
    </aside>

    <!-- 이미지 삽입 모달 -->
    <div class="image-modal" id="image-modal" aria-hidden="true">
      <div class="image-modal-backdrop" data-close="true"></div>
      <div class="image-modal-panel">
        <h3 class="image-modal-title">이미지 추가</h3>
        <input type="file" id="image-file-input" accept="image/jpeg,image/png,image/gif,image/webp" class="image-modal-input" />
        <div class="image-modal-actions">
          <button type="button" id="image-modal-cancel" class="image-modal-btn image-modal-btn-secondary">취소</button>
          <button type="button" id="image-modal-confirm" class="image-modal-btn image-modal-btn-primary">추가</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/board.js') }}"></script>
  </body>
</html>
