<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <title>내 보드 기록</title>
    <link href="../static/css/snapshot.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="toggleBtn" aria-expanded="true">
                <span class="material-symbols-outlined" id="toggleIcon">
                    arrow_back_ios
                </span>
            </button>

            <nav class="sidebar-nav">
                <a class="nav-item" href="/main" id="main-boards-btn">
                    <span class="material-symbols-outlined" id="mainBoardsIcon">dashboard</span>
                    <span class="txt" id="mainBoardsText">내가 만든 보드</span>
                </a>
                <button class="nav-item is-active" href="#" id="snapshot-btn">
                    <span class="material-symbols-outlined" id="myArchiveIcon">
                        archive
                    </span>
                    <span class="txt" id="myArchiveText">내 보드 기록</span>
                </button>
                <button class="nav-item" href="#" id="publicList-btn">
                    <span class="material-symbols-outlined" id="publicArchiveIcon">
                        public
                    </span>
                    <span class="txt" id="publicArchiveText">
                        공개된 보드 기록
                    </span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item" id="home-btn">
                    <span class="material-symbols-outlined" id="homeIcon">
                        home
                    </span>
                </button>
                <button class="logout">
                    <span class="material-symbols-outlined">
                        logout
                    </span>
                    <span id="logoutText">로그아웃</span>
                </button>
            </div>
        </aside>

        <main class="content">
            <h1>내 보드 기록</h1>
            <div class="content-body">
                <ul class="board-grid" id="card-list">
                    {% for s in snapshots|default([]) %}
                    <li class="board-card" data-snapshot-id="{{ s.id }}">
                        <div class="board-thumb board-thumb-clickable" data-image-url="{{ s.image_url }}">
                            <img src="{{ s.image_url }}" alt="">
                        </div>
                        <div class="board-footer">
                            <div class="board-name">{{ s.title or "제목 없음" }}</div>
                            <div class="board-footer-actions">
                                <div class="board-public">
                                    <span>공개여부</span>
                                    <input type="checkbox" class="public-toggle" data-id="{{ s.id }}" {% if s.is_public
                                        %}checked{% endif %}>
                                </div>
                                <button type="button" class="board-delete-btn" data-snapshot-id="{{ s.id }}"
                                    title="삭제">삭제</button>
                            </div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
                {% if not snapshots %}
                <p class="snapshot-empty" id="snapshot-empty">보드 기록이 없습니다.</p>
                {% endif %}
            </div>
        </main>

        <!-- 이미지 확대 뷰 모달 -->
        <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
            <div class="image-lightbox-backdrop"></div>
            <div class="image-lightbox-content">
                <button type="button" class="image-lightbox-close" aria-label="닫기">&times;</button>
                <img class="image-lightbox-img" src="" alt="확대 보기" />
            </div>
        </div>
        <script>
            const sidebar = document.getElementById("sidebar");
            const btn = document.getElementById("toggleBtn");
            const toggleIcon = document.getElementById("toggleIcon");
            const myArchiveText = document.getElementById("myArchiveText");
            const publicArchiveText = document.getElementById("publicArchiveText");
            const logoutText = document.getElementById("logoutText");

            btn.addEventListener("click", () => {
                const collapsed = sidebar.classList.toggle("is-collapsed");

                btn.setAttribute("aria-expanded", String(!collapsed));
                toggleIcon.textContent = collapsed ? "arrow_forward_ios" : "arrow_back_ios";
                document.getElementById("mainBoardsText").textContent = collapsed ? "" : "내가 만든 보드";
                myArchiveText.textContent = collapsed ? "" : "내 보드 기록";
                publicArchiveText.textContent = collapsed ? "" : "공개된 보드 기록";
                logoutText.textContent = collapsed ? "" : "로그아웃";
            });

            // 로그아웃
            document.querySelector(".logout").addEventListener("click", () => {
                fetch("/api/auth/logout", { method: "POST", credentials: "include" })
                    .then(() => { window.location.href = "/"; })
                    .catch(() => alert("로그아웃에 실패했습니다."));
            });

            // 내 보드 기록 버튼 - 스냅샷 페이지로 이동
            $("#snapshot-btn").click(function () {
                window.location.href = "/snapshot";
            });

            // 공개된 보드 기록 버튼 - publicList 페이지로 이동
            $("#publicList-btn").click(function () {
                window.location.href = "/publicList";
            });

            // 홈버튼 - main 페이지로 이동
            $("#home-btn").click(function () {
                window.location.href = "/main";
            });


            // 이벤트 위임: SSR로 렌더된 체크박스 작동
            $(document).on("change", ".public-toggle", function () {
                const snapshotId = $(this).data("id");
                const isPublic = $(this).is(":checked");
                $.ajax({
                    type: "PATCH",
                    url: `/api/snapshots/${snapshotId}`,
                    contentType: "application/json",
                    data: JSON.stringify({ is_public: isPublic }),
                    credentials: "include",
                    success: function () {
                        // 성공: 그대로 유지
                    },
                    error: function (xhr) {
                        // 실패: 체크 상태 원복
                        const msg = xhr.responseJSON?.error?.message || "공개 여부 변경에 실패했습니다.";
                        alert(msg);
                        $(`.public-toggle[data-id="${snapshotId}"]`).prop("checked", !isPublic);
                    },
                    complete: function () {
                        $(`.public-toggle[data-id="${snapshotId}"]`).prop("disabled", false);
                    }
                });
            });

            // 이미지 클릭 시 확대 보기
            $(document).on("click", ".board-thumb-clickable", function () {
                const url = $(this).data("image-url");
                if (!url) return;
                $("#image-lightbox .image-lightbox-img").attr("src", url);
                $("#image-lightbox").addClass("is-open").attr("aria-hidden", "false");
            });
            function closeImageLightbox() {
                $("#image-lightbox").removeClass("is-open").attr("aria-hidden", "true");
                $("#image-lightbox .image-lightbox-img").attr("src", "");
            }
            $("#image-lightbox .image-lightbox-backdrop, #image-lightbox .image-lightbox-close").on("click", closeImageLightbox);
            $(document).on("keydown", function (e) {
                if (e.key === "Escape" && $("#image-lightbox").hasClass("is-open")) closeImageLightbox();
            });

            // 삭제 버튼
            $(document).on("click", ".board-delete-btn", function (e) {
                e.stopPropagation();
                const id = $(this).data("snapshot-id");
                if (!id || !confirm("이 보드 기록을 삭제하시겠습니까?")) return;
                const $card = $(this).closest(".board-card");
                $.ajax({
                    type: "DELETE",
                    url: "/api/snapshots/" + id,
                    credentials: "include",
                    success: function () {
                        $card.fadeOut(200, function () { $(this).remove(); });
                    },
                    error: function (xhr) {
                        const msg = xhr.responseJSON?.error?.message || "삭제에 실패했습니다.";
                        alert(msg);
                    }
                });
            });
        </script>


</body>

</html>
