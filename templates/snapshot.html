<head>
    <meta charset="UTF-8" />

    <title>내 보드 기록</title>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="toggleBtn" aria-expanded="true">
                <span class="material-symbols-outlined" id="toggleIcon">
                    arrow_back_ios
                </span>
            </button>

            <nav class="sidebar-nav">
                <button class="nav-item is-active" href="#" id="snapshot-btn">
                    <span class="material-symbols-outlined" id="myArchiveIcon">
                        archive
                    </span>
                    <span class="txt" id="myArchiveText">내 보드 기록</span>
                </button>
                <button class="nav-item" href="#" id="publicList-btn">
                    <span class="material-symbols-outlined" id="publicArchiveIcon">
                        public
                    </span>
                    <span class="txt" id="publicArchiveText">
                        공개된 보드 기록
                    </span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item" id="home-btn">
                    <span class="material-symbols-outlined" id="homeIcon">
                        home
                    </span>
                </button>
                <button class="logout">
                    <span class="material-symbols-outlined">
                        logout
                    </span>
                    <span id="logoutText">로그아웃</span>
                </button>
            </div>
        </aside>

        <main class="content">
            <h1>내 보드 기록</h1>
            <div class="content-body">
                <ul class="board-grid" id="card-list">

                </ul>
            </div>
        </main>
        <script>
            const sidebar = document.getElementById("sidebar");
            const btn = document.getElementById("toggleBtn");
            const toggleIcon = document.getElementById("toggleIcon");
            const myArchiveText = document.getElementById("myArchiveText");
            const publicArchiveText = document.getElementById("publicArchiveText");
            const logoutText = document.getElementById("logoutText");

            btn.addEventListener("click", () => {
                const collapsed = sidebar.classList.toggle("is-collapsed");

                btn.setAttribute("aria-expanded", String(!collapsed));
                toggleIcon.textContent = collapsed ? "arrow_forward_ios" : "arrow_back_ios";
                myArchiveText.textContent = collapsed ? "" : "내 보드 기록";
                publicArchiveText.textContent = collapsed ? "" : "공개된 보드 기록";
                logoutText.textContent = collapsed ? "" : "로그아웃";
            });

            // 로그아웃
            document.querySelector(".logout").addEventListener("click", () => {
                fetch("/api/auth/logout", { method: "POST", credentials: "include" })
                    .then(() => { window.location.href = "/"; })
                    .catch(() => alert("로그아웃에 실패했습니다."));
            });

            // 내 보드 기록 버튼 - 스냅샷 페이지로 이동
            $("#snapshot-btn").click(function () {
                window.location.href = "/snapshot";
            });

            // 공개된 보드 기록 버튼 - publicList 페이지로 이동
            $("#publicList-btn").click(function () {
                window.location.href = "/publicList";
            });

            // 홈버튼 - main 페이지로 이동
            $("#home-btn").click(function () {
                window.location.href = "/main";
            });

            // // 체크박스 값이 변경되는 순간마다 패치 
            // $("#public-btn").change(function () {

            //     updateToggle(is_checked);

            // 새로고침 할 때마다 스냅샷 리스트 조회
            $(document).ready(function () { showSnapshots() });

            function showSnapshots() {
                $.ajax({
                    type: "GET",
                    url: "/api/snapshots/mine",
                    success: function (response) {
                        const shots = response["snapshots"] || [];
                        $("#card-list").empty();
                        for (let i = 0; i < shots.length; i++) {
                            makeSnapshotCard(shots[i]["id"], shots[i]["title"], shots[i]["image_url"], shots[i]["is_public"]);
                        }
                    },
                    error: function (xhr) {
                        const msg = xhr.responseJSON?.error?.message || "스냅샷 목록을 불러오지 못했습니다.";
                        alert(msg);
                    }
                });
            }

            function makeSnapshotCard(id, _title, image_url, is_public) {
                const checked = is_public ? "checked" : "";
                const title = (_title && String(_title).trim()) ? _title : "제목 없음";

                const tempHtml = `
      <li class="board-card" data-snapshot-id="${id}">
        <div class="board-thumb">
          <img src="${image_url}" alt="snapshot">
        </div>
        <div class="board-footer">
          <div class="board-name">${title}</div>
          <div class="board-public">
            <span>공개여부</span>
            <input type="checkbox" class="public-toggle" data-id="${id}" ${checked}>
          </div>
        </div>
      </li>
    `;
                $("#card-list").append(tempHtml);
            }

            // 이벤트 위임: 동적으로 생성된 체크박스 작동
            $(document).on("change", ".public-toggle", function () {
                const snapshotId = $(this).data("id");
                const isPublic = $(this).is(":checked");

                // // UI 잠깐 잠금(연타 방지)
                // $(this).prop("disabled", true);

                $.ajax({
                    type: "PATCH",
                    url: `/api/snapshots/${snapshotId}`,
                    contentType: "application/json",
                    data: JSON.stringify({ is_public: isPublic }),
                    success: function () {
                        // 성공: 그대로 유지
                    },
                    error: function (xhr) {
                        // 실패: 체크 상태 원복
                        const msg = xhr.responseJSON?.error?.message || "공개 여부 변경에 실패했습니다.";
                        alert(msg);
                        $(`.public-toggle[data-id="${snapshotId}"]`).prop("checked", !isPublic);
                    },
                    complete: function () {
                        $(`.public-toggle[data-id="${snapshotId}"]`).prop("disabled", false);
                    }
                });
            });
