<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <title>내가 만든 보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard 폰트 적용을 위한 CSS -->
    <!-- <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" /> -->

    <!-- Pretendard -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<style>
    body {
        font-family: 'Pretendard', sans-serif;
    }

    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
    }
</style>

<body>
    <div class="layout bg-slate-50 text-slate-900">
        <div class="flex min-h-screen">
            <aside
                class="sidebar w-64 shrink-0 border-r border-slate-200 bg-white transition-all duration-200 ease-in-out"
                id="sidebar">
                <div class="flex h-full flex-col p-3">
                    <button id="toggleBtn" aria-expanded="true"
                        class="mb-4 flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100">
                        <span class="material-symbols-outlined" id="toggleIcon">
                            arrow_back_ios
                        </span>
                    </button>

                    <nav class="sidebar-nav flex flex-col gap-2">
                        <a class="nav-item is-active flex h-12 items-center justify-center gap-2 rounded-xl bg-emerald-500 px-3 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-600"
                            href="/main" id="main-boards-btn">
                            <span class="material-symbols-outlined" id="mainBoardsIcon">dashboard</span>
                            <span class="txt whitespace-nowrap" id="mainBoardsText">내가 만든 보드</span>
                        </a>

                        <button
                            class="nav-item flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
                            href="#" id="snapshot-btn">
                            <span class="material-symbols-outlined" id="myArchiveIcon">
                                archive
                            </span>
                            <span class="txt whitespace-nowrap" id="myArchiveText">내 보드 기록</span>
                        </button>

                        <button
                            class="nav-item flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
                            href="#" id="publicList-btn">
                            <span class="material-symbols-outlined" id="publicArchiveIcon">
                                public
                            </span>
                            <span class="txt whitespace-nowrap" id="publicArchiveText">
                                공개된 보드 기록
                            </span>
                        </button>
                    </nav>
                    <div class="sidebar-bottom mt-auto pt-4">
                        <button
                            class="logout flex h-12 items-center justify-center gap-2 rounded-xl bg-white px-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50 hover:text-red-500">
                            <span class="material-symbols-outlined">
                                logout
                            </span>
                            <span id="logoutText" class="whitespace-nowrap">로그아웃</span>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Content -->
            <main class="content flex min-w-0 flex-1 flex-col p-6 md:p-8">
                <div class="content-title mb-6 flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">내가 만든 보드</h1>
                    </div>
                </div>

                <div class="content-body flex-1 overflow-y-auto">
                    <ul class="board-list space-y-3" id="board-list"></ul>
                </div>

                <!-- FAB -->
                <button
                    class="fab fixed bottom-6 right-6 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-500 text-3xl font-light text-white shadow-lg transition hover:scale-105 hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-200"
                    aria-label="보드 추가">+</button>
            </main>
        </div>


        <!-- Modal -->
        <div class="modal pointer-events-none fixed inset-0 z-50 opacity-0 transition duration-200"
            id="createBoardModal" aria-hidden="true">
            <div class="modal-backdrop absolute inset-0 bg-black/40" data-close="true"></div>

            <div class="modal-panel absolute left-1/2 top-1/2 w-[calc(100vw-2rem)] max-w-lg -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-white p-6 shadow-2xl md:p-8"
                role="dialog" aria-modal="true" aria-labelledby="createBoardTitle">
                <div class="mb-6 flex items-start justify-between">
                    <div>
                        <h2 id="createBoardTitle" class="modal-title text-xl font-bold text-slate-900 md:text-2xl">
                            보드 이름을 입력하세요
                        </h2>
                    </div>

                    <button
                        class="modal-close flex h-10 w-10 items-center justify-center rounded-full bg-red-500 text-white transition hover:bg-red-600"
                        type="button" id="modalCloseBtn" aria-label="닫기">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="space-y-4">
                    <input
                        class="modal-input w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100"
                        id="boardNameInput" type="text" placeholder="" />

                    <button
                        class="modal-submit w-full rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-emerald-600 disabled:cursor-not-allowed disabled:opacity-60"
                        id="createBoardBtn" type="button">보드 만들기</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const sidebar = document.getElementById("sidebar");
        const btn = document.getElementById("toggleBtn");
        const toggleIcon = document.getElementById("toggleIcon");
        const myArchiveText = document.getElementById("myArchiveText");
        const publicArchiveText = document.getElementById("publicArchiveText");
        const logoutText = document.getElementById("logoutText");
        const mainBoardsText = document.getElementById("mainBoardsText");

        btn.addEventListener("click", () => {
            const collapsed = sidebar.classList.toggle("w-64");
            sidebar.classList.toggle("w-20");

            const isCollapsed = sidebar.classList.contains("w-20");

            btn.setAttribute("aria-expanded", String(!isCollapsed));
            toggleIcon.textContent = isCollapsed ? "arrow_forward_ios" : "arrow_back_ios";

            mainBoardsText.textContent = isCollapsed ? "" : "내가 만든 보드";
            myArchiveText.textContent = isCollapsed ? "" : "내 보드 기록";
            publicArchiveText.textContent = isCollapsed ? "" : "공개된 보드 기록";
            logoutText.textContent = isCollapsed ? "" : "로그아웃";
        });

        const modal = document.getElementById("createBoardModal");
        const fab = document.querySelector(".fab");
        const modalCloseBtn = document.getElementById("modalCloseBtn");
        const boardNameInput = document.getElementById("boardNameInput");
        const createBoardBtn = document.getElementById("createBoardBtn");
        const boardList = document.getElementById("board-list");

        function openModal() {
            modal.classList.remove("pointer-events-none", "opacity-0");
            modal.classList.add("pointer-events-auto", "opacity-100");
            modal.setAttribute("aria-hidden", "false");
            boardNameInput.value = "";
            boardNameInput.focus();
        }

        function closeModal() {
            modal.classList.add("pointer-events-none", "opacity-0");
            modal.classList.remove("pointer-events-auto", "opacity-100");
            modal.setAttribute("aria-hidden", "true");
        }

        fab.addEventListener("click", openModal);
        modalCloseBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
            if (e.target.dataset.close === "true") closeModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("opacity-100")) closeModal();
        });

        function loadBoards() {
            fetch("/api/boards", { credentials: "include" })
                .then((r) => {
                    if (r.status === 401) {
                        window.location.href = "/";
                        return null;
                    }
                    if (!r.ok) throw new Error("보드 목록을 불러올 수 없습니다.");
                    return r.json();
                })
                .then((data) => {
                    if (!data) return;
                    renderBoards(data.boards || []);
                })
                .catch((err) => {
                    boardList.innerHTML = `
                        <li class="rounded-2xl border border-red-200 bg-red-50 px-4 py-4 text-sm text-red-600">
                            ${err.message}
                        </li>
                    `;
                });
        }

        function renderBoards(boards) {
            if (boards.length === 0) {
                boardList.innerHTML = `
                    <li class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center shadow-sm">
                        <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-slate-100 text-slate-500">
                            <span class="material-symbols-outlined">dashboard</span>
                        </div>
                        <p class="text-base font-semibold text-slate-700">보드가 없습니다</p>
                        <p class="mt-1 text-sm text-slate-500">오른쪽 아래 + 버튼으로 새 보드를 만들어보세요.</p>
                    </li>
                `;
                return;
            }

            boardList.innerHTML = boards.map((b) => `
                <li class="group rounded-2xl border border-slate-200 bg-white px-4 py-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
                    data-public-id="${escapeHtml(b.public_id)}">
                    <div class="flex items-center justify-between gap-4">
                        <div class="min-w-0 flex-1">
                            <a href="/boards/${b.public_id}"
                               class="block truncate text-base font-semibold text-slate-800 transition hover:text-emerald-600">
                                ${escapeHtml(b.title || "제목 없음")}
                            </a>
                        </div>

                        <div class="flex shrink-0 items-center gap-2">
                            <button
                                class="share-btn flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 transition hover:bg-slate-50 hover:text-slate-700"
                                type="button"
                                aria-label="공유하기"
                                data-url="${escapeHtml(window.location.origin + "/boards/" + b.public_id)}">
                                <span class="material-symbols-outlined text-[20px]">share</span>
                            </button>

                            <button
                                class="delete-btn flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 transition hover:bg-red-50 hover:text-red-600"
                                type="button"
                                aria-label="삭제"
                                data-public-id="${escapeHtml(b.public_id)}"
                                data-title="${escapeHtml(b.title || "제목 없음")}">
                                <span class="material-symbols-outlined text-[20px]">delete</span>
                            </button>
                        </div>
                    </div>
                </li>
            `).join("");

            boardList.querySelectorAll(".share-btn").forEach((el) => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const url = el.dataset.url;
                    navigator.clipboard.writeText(url)
                        .then(() => alert("보드 링크가 클립보드에 복사되었습니다."))
                        .catch(() => alert("복사 실패: " + url));
                });
            });

            boardList.querySelectorAll(".delete-btn").forEach((el) => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const publicId = el.dataset.publicId;
                    const title = el.dataset.title;
                    if (!confirm('"' + title + '" 보드를 삭제하시겠습니까? 보드 페이지로 이동 후 삭제 확인이 필요합니다.')) return;
                    window.location.href = "/boards/" + publicId + "?delete=1";
                });
            });
        }

        function escapeHtml(s) {
            const div = document.createElement("div");
            div.textContent = s;
            return div.innerHTML;
        }

        createBoardBtn.addEventListener("click", () => {
            const title = boardNameInput.value.trim() || "새 보드";
            createBoardBtn.disabled = true;

            fetch("/api/boards", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title }),
            })
                .then((r) => {
                    if (r.status === 401) {
                        alert("로그인이 필요합니다.");
                        return null;
                    }
                    if (!r.ok) throw new Error("보드 생성에 실패했습니다.");
                    return r.json();
                })
                .then((data) => {
                    createBoardBtn.disabled = false;
                    if (data) {
                        closeModal();
                        window.location.href = "/boards/" + data.public_id;
                    }
                })
                .catch((err) => {
                    createBoardBtn.disabled = false;
                    alert(err.message);
                });
        });

        document.querySelector(".logout").addEventListener("click", () => {
            fetch("/api/auth/logout", { method: "POST", credentials: "include" })
                .then(() => {
                    window.location.href = "/";
                })
                .catch(() => alert("로그아웃에 실패했습니다."));
        });

        loadBoards();

        $("#snapshot-btn").click(function () {
            window.location.href = "/snapshot";
        });

        $("#publicList-btn").click(function () {
            window.location.href = "/publicList";
        });
    </script>
</body>

</html>
