<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <title>내가 만든 보드</title>
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="toggleBtn" aria-expanded="true">
                <span class="material-symbols-outlined" id="toggleIcon">
                    arrow_back_ios
                </span>
            </button>

            <nav class="sidebar-nav">
                <a class="nav-item is-active" href="/main" id="main-boards-btn">
                    <span class="material-symbols-outlined" id="mainBoardsIcon">dashboard</span>
                    <span class="txt" id="mainBoardsText">내가 만든 보드</span>
                </a>
                <button class="nav-item" href="#" id="snapshot-btn">
                    <span class="material-symbols-outlined" id="myArchiveIcon">
                        archive
                    </span>
                    <span class="txt" id="myArchiveText">내 보드 기록</span>
                </button>
                <button class="nav-item" href="#" id="publicList-btn">
                    <span class="material-symbols-outlined" id="publicArchiveIcon">
                        public
                    </span>
                    <span class="txt" id="publicArchiveText">
                        공개된 보드 기록
                    </span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="logout">
                    <span class="material-symbols-outlined">
                        logout
                    </span>
                    <span id="logoutText">로그아웃</span>
                </button>
            </div>
        </aside>

        <main class="content">
            <h1>내가 만든 보드</h1>
            <div class="content-body">
                <ul class="board-list" id="board-list"></ul>
            </div>
            <button class="fab" aria-label="보드 추가">+</button>
        </main>

        <div class="modal" id="createBoardModal" aria-hidden="true">
            <div class="modal-backdrop" data-close="true"></div>

            <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="createBoardTitle">
                <button class="modal-close" type="button" id="modalCloseBtn" aria-label="닫기">
                    <span class="material-symbols-outlined">close</span>
                </button>

                <h2 class="modal-title" id="createBoardTitle">보드 이름을 입력하세요.</h2>

                <input class="modal-input" id="boardNameInput" type="text" placeholder="" />

                <button class="modal-submit" id="createBoardBtn" type="button">보드 만들기</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById("sidebar");
        const btn = document.getElementById("toggleBtn");
        const toggleIcon = document.getElementById("toggleIcon");
        const myArchiveText = document.getElementById("myArchiveText");
        const publicArchiveText = document.getElementById("publicArchiveText");
        const logoutText = document.getElementById("logoutText");

        btn.addEventListener("click", () => {
            const collapsed = sidebar.classList.toggle("is-collapsed");

            btn.setAttribute("aria-expanded", String(!collapsed));
            toggleIcon.textContent = collapsed ? "arrow_forward_ios" : "arrow_back_ios";
            document.getElementById("mainBoardsText").textContent = collapsed ? "" : "내가 만든 보드";
            myArchiveText.textContent = collapsed ? "" : "내 보드 기록";
            publicArchiveText.textContent = collapsed ? "" : "공개된 보드 기록";
            logoutText.textContent = collapsed ? "" : "로그아웃";
        });

        const modal = document.getElementById("createBoardModal");
        const fab = document.querySelector(".fab");
        const modalCloseBtn = document.getElementById("modalCloseBtn");
        const boardNameInput = document.getElementById("boardNameInput");
        const createBoardBtn = document.getElementById("createBoardBtn");
        const boardList = document.getElementById("board-list");

        function openModal() {
            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            boardNameInput.value = "";
            boardNameInput.focus();
        }

        function closeModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
        }

        fab.addEventListener("click", openModal);
        modalCloseBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
            if (e.target.dataset.close === "true") closeModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
        });

        // 보드 목록 로드
        function loadBoards() {
            fetch("/api/boards", { credentials: "include" })
                .then((r) => {
                    if (r.status === 401) {
                        window.location.href = "/";
                        return null;
                    }
                    if (!r.ok) throw new Error("보드 목록을 불러올 수 없습니다.");
                    return r.json();
                })
                .then((data) => {
                    if (!data) return;
                    renderBoards(data.boards || []);
                })
                .catch((err) => {
                    boardList.innerHTML = "<li class='board-item'>" + err.message + "</li>";
                });
        }

        function renderBoards(boards) {
            if (boards.length === 0) {
                boardList.innerHTML = "<li class='board-item'><span class='board-title'>보드가 없습니다. + 버튼으로 새 보드를 만드세요.</span></li>";
                return;
            }
            boardList.innerHTML = boards
                .map(
                    (b) =>
                        '<li class="board-item" data-public-id="' + escapeHtml(b.public_id) + '">' +
                        '<a href="/boards/' + b.public_id + '" class="board-title">' + escapeHtml(b.title || "제목 없음") + "</a>" +
                        '<div class="board-actions">' +
                        '<button class="share-btn" type="button" aria-label="공유하기" data-url="' + escapeHtml(window.location.origin + "/boards/" + b.public_id) + '">' +
                        '<span class="material-symbols-outlined">share</span></button>' +
                        '<button class="delete-btn" type="button" aria-label="삭제" data-public-id="' + escapeHtml(b.public_id) + '" data-title="' + escapeHtml(b.title || "제목 없음") + '">' +
                        '<span class="material-symbols-outlined">delete</span></button>' +
                        '</div></li>'
                )
                .join("");
            boardList.querySelectorAll(".share-btn").forEach((el) => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const url = el.dataset.url;
                    navigator.clipboard.writeText(url).then(() => alert("보드 링크가 클립보드에 복사되었습니다.")).catch(() => alert("복사 실패: " + url));
                });
            });
            boardList.querySelectorAll(".delete-btn").forEach((el) => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const publicId = el.dataset.publicId;
                    const title = el.dataset.title;
                    if (!confirm('"' + title + '" 보드를 삭제하시겠습니까? 보드 페이지로 이동 후 삭제 확인이 필요합니다.')) return;
                    window.location.href = "/boards/" + publicId + "?delete=1";
                });
            });
        }

        function escapeHtml(s) {
            const div = document.createElement("div");
            div.textContent = s;
            return div.innerHTML;
        }

        // 보드 만들기
        createBoardBtn.addEventListener("click", () => {
            const title = boardNameInput.value.trim() || "새 보드";
            createBoardBtn.disabled = true;
            fetch("/api/boards", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title }),
            })
                .then((r) => {
                    if (r.status === 401) {
                        alert("로그인이 필요합니다.");
                        return null;
                    }
                    if (!r.ok) throw new Error("보드 생성에 실패했습니다.");
                    return r.json();
                })
                .then((data) => {
                    createBoardBtn.disabled = false;
                    if (data) {
                        closeModal();
                        window.location.href = "/boards/" + data.public_id;
                    }
                })
                .catch((err) => {
                    createBoardBtn.disabled = false;
                    alert(err.message);
                });
        });

        // 로그아웃
        document.querySelector(".logout").addEventListener("click", () => {
            fetch("/api/auth/logout", { method: "POST", credentials: "include" })
                .then(() => { window.location.href = "/"; })
                .catch(() => alert("로그아웃에 실패했습니다."));
        });

        loadBoards();

        // 내 보드 기록 버튼 - 스냅샷 페이지로 이동
        $("#snapshot-btn").click(function () {
            window.location.href = "/snapshot";
        });

        // 공개된 보드 기록 버튼 - publicList 페이지로 이동
        $("#publicList-btn").click(function () {
            window.location.href = "/publicList";
        });
    </script>


</body>

</html>
