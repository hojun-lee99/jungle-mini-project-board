<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>로그인</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet" />
</head>

<body>
  <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <!-- <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="Your Company" class="mx-auto h-10 w-auto" /> -->
      <h2 class="mt-10 text-center text-[50px] font-bold tracking-tight text-[#05d182]">Jungle</h2>
      <h2 class="mt-2 text-center text-[40px] font-bold tracking-tight text-gray-900">칠판</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form id="login-form" class="space-y-6">
        <div>
          <label for="username" class="block text-sm/6 font-medium text-gray-900">이름</label>
          <div class="mt-2">
            <input id="username" type="text" name="username" required autocomplete="username"
              class="block w-full rounded-md bg-white border border-black px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm/6 font-medium text-gray-900">비밀번호</label>
          </div>
          <div class="mt-2 ">

            <input id="password" type="password" name="password" required autocomplete="current-password"
              class="block w-full rounded-md bg-white border border-black px-3 py-1.5 text-base text-gray-900 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-[#05d182] sm:text-sm/6" />
          </div>
        </div>


        <div>
          <button type="submit"
            class="flex w-full justify-center rounded-md bg-[#05d182] px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs focus-visible:outline-2 focus-visible:outline-offset-2 ">로그인</button>
        </div>

        <div id="login-error" class="text-sm text-red-600 hidden"></div>

        <div>
          <button type="button" id="register-btn"
            class="flex w-full justify-center rounded-md bg-[#F2F4F8] px-3 py-1.5 text-sm/6 font-semibold text-black shadow-xs focus-visible:outline-2 focus-visible:outline-offset-2">회원가입</button>
        </div>
      </form>


    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
